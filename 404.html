<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>隔空贴 PasteFerry</title>
  <script>
    (function () {
      var prefix = /^\/(?:copysync|pasteferry)(?=\/|$)/.exec(location.pathname);
      var path = prefix ? location.pathname.slice(prefix[0].length) || "/" : "/";
      location.replace("https://pasteferry.cc" + path + location.search + location.hash);
    })();
  </script>
</head>
<body><p><a href="https://pasteferry.cc/">隔空贴 PasteFerry</a></p></body>
</html>
